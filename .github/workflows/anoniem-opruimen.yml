# Ruimt elke maand verlopen deellinks op, en anonieme accounts die ouder zijn dan 30 dagen en geen links meer hebben (zie PLAN.md, 0.32.1).
# Gratis: GitHub Actions, geen Firebase Functions. Zonder het geheim FIREBASE_SERVICE_ACCOUNT doet dit niets.
name: Links en anonieme accounts opruimen

on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opruimen:
    runs-on: ubuntu-latest
    env:
      SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Geheim ingesteld?
        if: env.SERVICE_ACCOUNT == ''
        run: echo "FIREBASE_SERVICE_ACCOUNT ontbreekt; er gebeurt niets."
      - uses: actions/checkout@v4
        if: env.SERVICE_ACCOUNT != ''
      - uses: actions/setup-node@v4
        if: env.SERVICE_ACCOUNT != ''
        with:
          node-version: 22
          cache: npm
      - if: env.SERVICE_ACCOUNT != ''
        run: npm ci --ignore-scripts
      - name: Opruimen
        if: env.SERVICE_ACCOUNT != ''
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node tools/firebase-anoniem-opruimen.cjs --ouder-dan 30
          rm -f "$RUNNER_TEMP/sa.json"
